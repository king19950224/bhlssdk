<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>BoltPreload 实时演示</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 20px; background: #f6f7f9; }
    h1 { font-size: 18px; margin: 0 0 12px; color: #222; }
    .status { padding: 4px 10px; border-radius: 4px; font-size: 13px; display: inline-block; }
    .status.connected { background: #d4f7dc; color: #1b5e20; }
    .status.disconnected { background: #fde6e6; color: #b71c1c; }
    .row { display: flex; gap: 20px; margin-top: 16px; }
    .col { background: white; border: 1px solid #ddd; border-radius: 6px; padding: 14px; flex: 1; }
    .col h2 { margin: 0 0 10px; font-size: 14px; color: #444; font-weight: 600; }
    table { border-collapse: collapse; width: 100%; font-size: 12px; }
    th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #eee; }
    th { background: #f6f6f6; font-weight: 600; }
    tr:hover { background: #fafbff; }
    .status-bad { color: #c00; font-weight: 600; }
    .status-good { color: #2e7d32; }
    .num { font-family: ui-monospace, SFMono-Regular, monospace; }
    .stats { font-size: 12px; color: #666; margin-top: 6px; }
  </style>
</head>
<body>
  <h1>BoltPreload 实时测量演示
    <span id="conn" class="status disconnected">未连接</span>
  </h1>
  <div class="stats">收到测量：<span id="cntMeas">0</span> 条 · 设备参数：<span id="cntParam">0</span> 条</div>

  <div class="row">
    <div class="col">
      <h2>最近 50 条 ChannelResult</h2>
      <table>
        <thead><tr><th>时刻</th><th>设备</th><th>通道</th><th>状态</th><th>EchoTime(ns)</th><th>温度(°C)</th><th>波形</th></tr></thead>
        <tbody id="meas"></tbody>
      </table>
    </div>
    <div class="col" style="max-width: 30%;">
      <h2>最近 30 条 DeviceParameter</h2>
      <table>
        <thead><tr><th>时刻</th><th>通道</th><th>参数</th><th>值</th></tr></thead>
        <tbody id="param"></tbody>
      </table>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@microsoft/signalr@8.0.7/dist/browser/signalr.min.js"></script>
  <script>
    const measTbody = document.getElementById("meas");
    const paramTbody = document.getElementById("param");
    const connBadge = document.getElementById("conn");
    const cntMeas = document.getElementById("cntMeas");
    const cntParam = document.getElementById("cntParam");
    let measCount = 0, paramCount = 0;

    function prependRow(tbody, cells, max) {
      const tr = document.createElement("tr");
      cells.forEach(c => {
        const td = document.createElement("td");
        if (typeof c === "object" && c.html) td.innerHTML = c.html;
        else td.textContent = c;
        if (typeof c === "object" && c.cls) td.className = c.cls;
        tr.appendChild(td);
      });
      tbody.insertBefore(tr, tbody.firstChild);
      while (tbody.rows.length > max) tbody.removeChild(tbody.lastChild);
    }

    function fmt(v, digits = 2) {
      if (v === null || v === undefined) return "—";
      const n = Number(v);
      return isNaN(n) ? String(v) : n.toFixed(digits);
    }

    const connection = new signalR.HubConnectionBuilder()
      .withUrl("/hubs/measurements")
      .withAutomaticReconnect()
      .build();

    connection.on("OnMeasurement", m => {
      measCount++;
      cntMeas.textContent = measCount;
      const ts = new Date(m.ts).toLocaleTimeString("zh-CN", { hour12: false }) + "." + String(new Date(m.ts).getMilliseconds()).padStart(3, "0");
      prependRow(measTbody, [
        ts,
        m.deviceId,
        m.channel,
        { html: m.statusCode < 0 ? `<span class="status-bad">${m.statusCode}</span>` : `<span class="status-good">${m.statusCode}</span>` },
        { html: `<span class="num">${m.echoTimeNs === null ? "—" : fmt(m.echoTimeNs)}</span>` },
        { html: `<span class="num">${fmt(m.spTempC)}</span>` },
        m.hasWave ? "有" : "—"
      ], 50);
    });

    connection.on("OnDeviceParameter", p => {
      paramCount++;
      cntParam.textContent = paramCount;
      const ts = new Date(p.ts).toLocaleTimeString("zh-CN", { hour12: false });
      const valueShort = (p.valueText || "").length > 30 ? p.valueText.slice(0, 30) + "…" : p.valueText;
      prependRow(paramTbody, [ts, p.channel ?? "—", p.paramName, valueShort], 30);
    });

    connection.onreconnecting(() => { connBadge.className = "status disconnected"; connBadge.textContent = "重连中..."; });
    connection.onreconnected(() => { connBadge.className = "status connected"; connBadge.textContent = "已连接"; });
    connection.onclose(() => { connBadge.className = "status disconnected"; connBadge.textContent = "已断开"; });

    connection.start()
      .then(() => { connBadge.className = "status connected"; connBadge.textContent = "已连接"; })
      .catch(err => { connBadge.textContent = "连接失败：" + err.message; });
  </script>
</body>
</html>
