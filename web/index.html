<!doctype html>
<html lang="zh-CN" class="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- CSP 纵深防御：JWT 存于 localStorage，一旦出现 XSS 令牌可被窃取。核心是 script-src 'self'——
         禁止内联/注入脚本执行（XSS 主要载荷路径）。style-src 保留 unsafe-inline（Element Plus / ECharts
         运行时注入内联样式必需）；字体走 Google Fonts；connect-src 'self' 覆盖同源 API 与 SignalR ws/wss。 -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>螺栓预紧力在线监测系统</title>
    <style>
      /* 首屏占位：在 JS 包/样式加载完成、Vue 挂载前避免整页空白（硬刷新/深链/弱网时尤为明显）。
         Vue 挂载到 #app 时会替换其内容，占位随之消失，无需额外脚本清理。 */
      html, body { margin: 0; height: 100%; background: #060912; }
      #app-splash {
        position: fixed; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 18px;
        background: radial-gradient(900px 600px at 70% -10%, rgba(34, 211, 238, 0.08), transparent), #060912;
        color: #cbd5e1; font-family: 'Inter', system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      }
      #app-splash .sp-ring {
        width: 44px; height: 44px; border-radius: 50%;
        border: 3px solid rgba(34, 211, 238, 0.18); border-top-color: #22d3ee;
        animation: sp-spin 0.9s linear infinite;
      }
      #app-splash .sp-txt { font-size: 14px; letter-spacing: 0.04em; }
      #app-splash .sp-sub { font-size: 12px; color: #61748f; letter-spacing: 0.16em; }
      @keyframes sp-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="app-splash">
        <div class="sp-ring"></div>
        <div class="sp-txt">螺栓预紧力在线监测系统</div>
        <div class="sp-sub">正在加载控制台…</div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
