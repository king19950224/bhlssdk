name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  DOTNET_VERSION: '8.0.x'
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        # 用 TimescaleDB 镜像跑 CI（跟开发环境完全一致）
        image: timescale/timescaledb:2.17.2-pg16
        env:
          POSTGRES_DB: boltpreload
          POSTGRES_USER: boltpreload
          POSTGRES_PASSWORD: ci_password_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U boltpreload -d boltpreload"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 等待数据库就绪
        run: |
          for i in {1..30}; do
            if pg_isready -h localhost -p 5432 -U boltpreload; then
              echo "DB ready"; exit 0
            fi
            sleep 1
          done
          echo "DB not ready"; exit 1

      - name: 初始化数据库 schema
        run: |
          # 按文件名序号顺序执行全部迁移（与 docker-compose initdb / 工控机 Inno Setup 同一套脚本），
          # 不止 0001：否则 CI 库缺 0002~00NN 的表，集成测试与真实 schema 不一致。
          for f in $(ls deploy/sql/0*.sql | sort); do
            echo "applying $f"
            PGPASSWORD=ci_password_only psql -h localhost -U boltpreload -d boltpreload -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: 还原依赖
        run: dotnet restore BoltPreload.sln

      - name: 编译
        run: dotnet build BoltPreload.sln --no-restore --configuration Release

      - name: 单元测试
        run: dotnet test BoltPreload.sln --no-build --configuration Release \
              --logger "console;verbosity=normal" \
              --collect:"XPlat Code Coverage"
        env:
          ConnectionStrings__Postgres: "Host=localhost;Port=5432;Database=boltpreload;Username=boltpreload;Password=ci_password_only"

      - name: 上传覆盖率
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: '**/coverage.cobertura.xml'

  # 前端此前完全不在 CI 里：9000+ 行、17 个页面的类型错误与依赖漏洞只能靠人工发现，
  # 而 dotnet publish 会把 web/dist 打进 wwwroot —— 前端构建挂了等于交付包里没有界面。
  web:
    name: Web Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 类型检查 + 构建
        # build 脚本本身就是 `vue-tsc -b && vite build`，类型错误会在这里失败
        run: npm run build

      - name: 校验构建产物存在
        # 交付包靠 web/dist 生成 wwwroot；产物缺失时客户打开是空白页，必须在 CI 拦住
        run: |
          test -f dist/index.html || { echo "dist/index.html 缺失"; exit 1; }
          test -d dist/assets || { echo "dist/assets 缺失"; exit 1; }

      - name: 依赖漏洞审计
        run: npm audit --audit-level=high
