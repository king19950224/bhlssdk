name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  DOTNET_VERSION: '8.0.x'
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        # 用 TimescaleDB 镜像跑 CI（跟开发环境完全一致）
        image: timescale/timescaledb:2.17.2-pg16
        env:
          POSTGRES_DB: boltpreload
          POSTGRES_USER: boltpreload
          POSTGRES_PASSWORD: ci_password_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U boltpreload -d boltpreload"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 等待数据库就绪
        run: |
          for i in {1..30}; do
            if pg_isready -h localhost -p 5432 -U boltpreload; then
              echo "DB ready"; exit 0
            fi
            sleep 1
          done
          echo "DB not ready"; exit 1

      - name: 初始化数据库 schema
        run: |
          # 按文件名序号顺序执行全部迁移（与 docker-compose initdb / 工控机 Inno Setup 同一套脚本），
          # 不止 0001：否则 CI 库缺 0002~00NN 的表，集成测试与真实 schema 不一致。
          for f in $(ls deploy/sql/0*.sql | sort); do
            echo "applying $f"
            PGPASSWORD=ci_password_only psql -h localhost -U boltpreload -d boltpreload -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: 还原依赖
        run: dotnet restore BoltPreload.sln

      - name: 编译
        run: dotnet build BoltPreload.sln --no-restore --configuration Release

      - name: 单元测试
        # 必须是 | 块标量：不带 | 的话 YAML 会把换行折成空格、反斜杠原样留下，
        # 到 shell 手里 "\ " 成了转义空格，参数变成 " --logger"，
        # dotnet test 当成第二个项目路径，报 MSB1008 直接失败，一条测试都不会跑。
        run: |
          dotnet test BoltPreload.sln --no-build --configuration Release \
            --logger "console;verbosity=normal" \
            --logger "trx;LogFileName=results.trx" \
            --collect:"XPlat Code Coverage"
        env:
          ConnectionStrings__Postgres: "Host=localhost;Port=5432;Database=boltpreload;Username=boltpreload;Password=ci_password_only"

      - name: 门禁：跳过的测试必须为 0
        # dotnet test 连不上库时把 DB 集成测试整批记为 Skipped，退出码仍是 0、末行仍写"已通过"。
        # 这批恰好是覆盖面最广的（权限守卫、告警管线、入库热路径、EF 与手写 schema 一致性），
        # 少了它们的绿灯比红灯更危险。README 要求人工确认"已跳过: 0"，这里改成机器拦。
        run: |
          python3 - <<'PY'
          import glob, sys, xml.etree.ElementTree as ET
          NS = {'t': 'http://microsoft.com/schemas/VisualStudio/TeamTest/2010'}
          files = sorted(glob.glob('**/results.trx', recursive=True))
          if not files:
              sys.exit('找不到 trx 结果文件，跳过数无法核对')
          skipped_total = 0
          for f in files:
              c = ET.parse(f).getroot().find('t:ResultSummary/t:Counters', NS)
              # 跳过数只能这么算：xUnit 的 Skip 不进 notExecuted（实测恒为 0），
              # 而是记在 total 里、不记进 executed。照 notExecuted 判就是一道永远放行的假门禁。
              total, executed = int(c.get('total', 0)), int(c.get('executed', 0))
              n = total - executed
              skipped_total += n
              print(f'{f}: 总计={total} 已执行={executed} 通过={c.get("passed")} '
                    f'失败={c.get("failed")} 跳过={n}')
          if skipped_total:
              sys.exit(f'有 {skipped_total} 条测试被跳过 —— 多半是 Postgres 没连上导致集成测试整批未执行。')
          print('跳过数为 0')
          PY

      - name: 上传覆盖率
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: '**/coverage.cobertura.xml'

  # 交付目标是 Windows 工控机，CI 却只在 ubuntu 上编译过 —— Windows 侧的编译问题只能等到
  # 出包那天在现场机器上撞见。实测就撞过一次：开发机是 macOS，仓库拷到 Windows 后每个文件旁
  # 多出一份 AppleDouble 元数据文件（._xxx，二进制），MSBuild 的 **/*.cs 通配把 39 个 ._*.cs
  # 当源码编译，报 CS2015 整个解决方案编不过（已在 Directory.Build.props 排除）。
  # 这个 job 不接数据库、只编译 + 走一遍交付用的 publish，够挡住这一类。
  windows-build:
    name: Windows Build
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 编译
        run: dotnet build BoltPreload.sln --configuration Release

      - name: 交付发布冒烟（与出包同一条命令）
        run: dotnet publish src/BoltPreload.Api/BoltPreload.Api.csproj --configuration Release -o publish-smoke

      - name: 校验发布产物
        shell: pwsh
        run: |
          if (!(Test-Path publish-smoke/BoltPreload.Api.exe)) {
            throw "publish 没产出 BoltPreload.Api.exe —— 交付包会缺主程序"
          }

  # 前端此前完全不在 CI 里：9000+ 行、17 个页面的类型错误与依赖漏洞只能靠人工发现，
  # 而 dotnet publish 会把 web/dist 打进 wwwroot —— 前端构建挂了等于交付包里没有界面。
  web:
    name: Web Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 类型检查 + 构建
        # build 脚本本身就是 `vue-tsc -b && vite build`，类型错误会在这里失败
        run: npm run build

      - name: 校验构建产物存在
        # 交付包靠 web/dist 生成 wwwroot；产物缺失时客户打开是空白页，必须在 CI 拦住
        run: |
          test -f dist/index.html || { echo "dist/index.html 缺失"; exit 1; }
          test -d dist/assets || { echo "dist/assets 缺失"; exit 1; }

      - name: 依赖漏洞审计
        run: npm audit --audit-level=high

  # 七道门禁此前只能靠人记得手动敲一次，从没进过 CI —— 等于没有门禁，
  # 注释覆盖、遗留标记、文风、前后端对照表一致性全靠自觉。
  # 脚本只用 Python 标准库，不需要数据库和 .NET，单独一个轻量 job 就够。
  audit:
    name: Code Audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 代码审计门禁
        # G1-G4、G6、G7 全部归零才退出 0；G5 是报告级，只提示不拦截
        run: python3 tools/code-audit.py
