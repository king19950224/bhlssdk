name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  DOTNET_VERSION: '8.0.x'
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  # 交付目标是 Windows 工控机，在 windows 跑编译。
  # 两个软件都在解决方案里：现场桌面软件 FxMonitor、业主大屏 BoltPreload.Monitor。
  build:
    name: Build (Windows)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 编译
        run: dotnet build BoltPreload.sln --configuration Release
