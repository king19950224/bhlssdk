name: boltpreload-dev

services:
  postgres:
    image: timescale/timescaledb:2.17.2-pg16
    container_name: boltpreload-pg
    restart: unless-stopped
    environment:
      POSTGRES_DB: boltpreload
      POSTGRES_USER: boltpreload
      POSTGRES_PASSWORD: dev_only_NOT_for_production
      # 仅开发用密码。生产用 Windows 工控机原生 PG + secrets 管理。
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C.UTF-8"
      TZ: Asia/Shanghai
      PGTZ: Asia/Shanghai
    ports:
      - "127.0.0.1:5432:5432"   # 只绑 localhost，避免外网误访问
    volumes:
      - ../.docker-data/postgres:/var/lib/postgresql/data
      # 整目录挂载 + 通配执行，不再逐个列文件：
      # 此前是把每个 .sql 单独 mount 进 initdb.d，那份清单漂移过 —— 只挂到 0021，
      # 而 deploy/sql/ 已有到 0024，新机器建出来的开发库比 CI 和生产少 3 个迁移且毫无提示。
      # 现在新增迁移只需放进 deploy/sql/，不必再改本文件。
      - ./sql:/sql:ro
      - ./docker-initdb.sh:/docker-entrypoint-initdb.d/00_init.sh:ro
      # 注：dev 种子由该脚本从 /sql/dev 读取；生产部署只跑 deploy/sql/0*.sql，不含 dev/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U boltpreload -d boltpreload"]
      interval: 10s
      timeout: 5s
      retries: 5
    # 性能基础调优（开发用，生产以工控机配置另调）
    command:
      - "postgres"
      - "-c"
      - "shared_preload_libraries=timescaledb"
      - "-c"
      - "max_connections=100"
      - "-c"
      - "shared_buffers=512MB"
      - "-c"
      - "work_mem=16MB"
      - "-c"
      - "maintenance_work_mem=256MB"
      - "-c"
      - "effective_cache_size=2GB"
      - "-c"
      - "log_min_duration_statement=200"
      - "-c"
      - "log_statement=mod"

# 注：docker-compose 是开发用。
# 工控机部署的 PG 走 Windows 原生安装，步骤见 资料/工程文档/deployment-guide.md（Inno Setup 打包未做）。
