name: boltpreload-dev

services:
  postgres:
    image: timescale/timescaledb:2.17.2-pg16
    container_name: boltpreload-pg
    restart: unless-stopped
    environment:
      POSTGRES_DB: boltpreload
      POSTGRES_USER: boltpreload
      POSTGRES_PASSWORD: dev_only_NOT_for_production
      # 仅开发用密码。生产用 Windows 工控机原生 PG + secrets 管理。
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C.UTF-8"
      TZ: Asia/Shanghai
      PGTZ: Asia/Shanghai
    ports:
      - "127.0.0.1:5432:5432"   # 只绑 localhost，避免外网误访问
    volumes:
      - ../.docker-data/postgres:/var/lib/postgresql/data
      # initdb 按文件名字典序执行，先 schema (0001~00NN) 再 dev seed
      - ./sql/0001_initial_schema.sql:/docker-entrypoint-initdb.d/01_0001_initial_schema.sql:ro
      - ./sql/0002_device_parameter_history.sql:/docker-entrypoint-initdb.d/02_0002_device_parameter_history.sql:ro
      - ./sql/0003_unbound_measurements_and_autodiscover.sql:/docker-entrypoint-initdb.d/03_0003_unbound_measurements_and_autodiscover.sql:ro
      - ./sql/0004_alarms.sql:/docker-entrypoint-initdb.d/04_0004_alarms.sql:ro
      - ./sql/0005_torque_test_points.sql:/docker-entrypoint-initdb.d/05_0005_torque_test_points.sql:ro
      - ./sql/0006_torque_test_point_exclusion.sql:/docker-entrypoint-initdb.d/06_0006_torque_test_point_exclusion.sql:ro
      - ./sql/0007_calibration_intercept.sql:/docker-entrypoint-initdb.d/07_0007_calibration_intercept.sql:ro
      - ./sql/0008_channel_config_change_requests.sql:/docker-entrypoint-initdb.d/08_0008_channel_config_change_requests.sql:ro
      - ./sql/0009_wave_features_reference_waves.sql:/docker-entrypoint-initdb.d/09_0009_wave_features_reference_waves.sql:ro
      - ./sql/0010_reports.sql:/docker-entrypoint-initdb.d/10_0010_reports.sql:ro
      - ./sql/0011_safety_fixes.sql:/docker-entrypoint-initdb.d/11_0011_safety_fixes.sql:ro
      - ./sql/0012_multichannel_model.sql:/docker-entrypoint-initdb.d/12_0012_multichannel_model.sql:ro
      - ./sql/0013_channel_probe_scan.sql:/docker-entrypoint-initdb.d/13_0013_channel_probe_scan.sql:ro
      - ./sql/0014_channel_name.sql:/docker-entrypoint-initdb.d/14_0014_channel_name.sql:ro
      - ./sql/0015_calibration_review_state.sql:/docker-entrypoint-initdb.d/15_0015_calibration_review_state.sql:ro
      - ./sql/0016_channel_config_change_approval.sql:/docker-entrypoint-initdb.d/16_0016_channel_config_change_approval.sql:ro
      - ./sql/0017_alarm_cleared_by.sql:/docker-entrypoint-initdb.d/17_0017_alarm_cleared_by.sql:ro
      - ./sql/0018_turbines.sql:/docker-entrypoint-initdb.d/18_0018_turbines.sql:ro
      - ./sql/0019_calibration_self_signed_state.sql:/docker-entrypoint-initdb.d/19_0019_calibration_self_signed_state.sql:ro
      - ./sql/0020_user_token_version.sql:/docker-entrypoint-initdb.d/20_0020_user_token_version.sql:ro
      - ./sql/0021_wave_features_unique.sql:/docker-entrypoint-initdb.d/21_0021_wave_features_unique.sql:ro
      - ./sql/dev/0001_dev_seed.sql:/docker-entrypoint-initdb.d/99_dev_seed.sql:ro
      - ./sql/dev/0002_dev_seed_assets.sql:/docker-entrypoint-initdb.d/99b_dev_seed_assets.sql:ro
      - ./sql/dev/0003_dev_seed_real_probes.sql:/docker-entrypoint-initdb.d/99c_dev_seed_real_probes.sql:ro
      # 生产部署用 Inno Setup 跑 deploy/sql/00*.sql，不挂载 dev/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U boltpreload -d boltpreload"]
      interval: 10s
      timeout: 5s
      retries: 5
    # 性能基础调优（开发用，生产以工控机配置另调）
    command:
      - "postgres"
      - "-c"
      - "shared_preload_libraries=timescaledb"
      - "-c"
      - "max_connections=100"
      - "-c"
      - "shared_buffers=512MB"
      - "-c"
      - "work_mem=16MB"
      - "-c"
      - "maintenance_work_mem=256MB"
      - "-c"
      - "effective_cache_size=2GB"
      - "-c"
      - "log_min_duration_statement=200"
      - "-c"
      - "log_statement=mod"

# 注：docker-compose 是开发用。
# 工控机部署的 PG 走 Windows 原生安装（Inno Setup 打包），见 deploy/installer/。
